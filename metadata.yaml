name: astrbot_plugin_xbimg
display_name: 消息转图助手
short_desc: 把机器人文本消息渲染为图片发送，附内容审查与 Web 控制台。
desc: |
  消息转图助手：将机器人发出的文本消息渲染为图片发送。

  - 专注经典高级转图风格（iOS 灵动磨砂、Android 质感胶囊、国风金龙），去除冗余装饰与 AI 感，支持 Markdown 排版
  - 支持自定义转图强调色（Hex 调色盘与 5 款预设色块快速点击）与按群独立配色
  - 星空背景与三档画质
  - 多套敏感词库审查与违规处置（半字打码、全码、拦截、警示卡片）
  - 按群配置字体、风格与词库
  - 全屏 Web 控制台与实时渲染测试台
version: 1.3.46
author: Light
repo: https://github.com/imsuperone/xbimg
support_platforms:
  - aiocqhttp
pages:
  - name: manager
    title: 消息转图
    path: pages/manager/index.html
astrbot_version: ">=3.4.0"
