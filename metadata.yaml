name: astrbot_plugin_xbimg
display_name: 消息转图助手
short_desc: 把机器人文本消息渲染为图片发送，附内容审查与 Web 控制台。
desc: |
  消息转图助手：将机器人发出的文本消息渲染为图片发送。

  - iOS 与 Android 16 两种主题风格，支持 Markdown 排版
  - 星空背景与三档画质
  - 敏感词审查与违规处置（打码、拦截、警示卡片），支持 AI 审查
  - 按群配置字体、风格与词库
  - 全屏 Web 控制台与实时渲染测试台
version: 1.3.23
author: Light
repo: https://github.com/imsuperone/xbimg
support_platforms:
